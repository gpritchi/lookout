[project]
name = "lookout"
version = "0.1.0"
description = "Tiered camera-event escalation: cheap local detection, priority-scheduled VLM escalation chains, Home Assistant actions"
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.3",
    "openvino>=2025.1",
    "opencv-python>=4.10",
    "pydantic>=2.9",
    "prometheus-client>=0.21",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lookout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
