[project]
name = "lookout"
version = "0.1.0"
description = "Tiered camera-event escalation: cheap local detection, priority-scheduled VLM escalation chains, Home Assistant actions"
requires-python = ">=3.11"
dependencies = [
    "openvino>=2025.1",
    # Headless: no window is ever opened, and the GUI build links libGL, which
    # drags ~200 MB of Mesa into the image. See override-dependencies below.
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "prometheus-client>=0.21",
    "httpx>=0.27",
]

# Ultralytics and torch are NOT needed to run lookout: the detector runs the
# exported OpenVINO model with the openvino runtime directly (tier1.py). They
# are needed to export that model (the Dockerfile's detector stage, or the
# first run on a laptop without an export) and for `tier1.backend: "torch"`.
#   uv sync --extra torch
[project.optional-dependencies]
torch = [
    "ultralytics>=8.3",
    # Direct only so [tool.uv.sources] below can pin them to the CPU wheel index;
    # uv applies sources to direct dependencies, not transitive ones.
    "torch>=2.4",
    "torchvision>=0.19",
]

[tool.uv]
# Ultralytics (the torch extra) requires the GUI opencv-python. Installed next
# to the headless build, both write the same cv2 package and whichever lands
# last wins. This override drops Ultralytics' requirement so the headless cv2
# serves it too (it only reads and writes images). pip does not read this, so
# a pip install with the extra gets both.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

# Wherever torch is installed (the export stage, the torch extra), on Linux the
# default index resolves the CUDA build plus several GB of NVIDIA libraries
# that nothing here uses. Pin Linux to the CPU wheels; macOS keeps the default
# (MPS-capable) wheel.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lookout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
