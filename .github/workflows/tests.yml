# Run the test suite on every push, on the self-hosted runner named by the
# RUNNER repository variable. Same reasoning as build-image.yml: no
# pull_request trigger, because a fork's workflow must never reach a private
# runner. Branch pushes from this repo are what gets tested, which is how the
# PRs here are made.
name: tests

on:
  push:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ${{ vars.RUNNER }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"
          enable-cache: true

      # cv2 links libGL and glib even when no window is ever opened; the runner
      # image is bare Ubuntu. Same two packages the Dockerfile installs.
      - name: System libraries for OpenCV
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libgl1 libglib2.0-0

      - name: Install
        run: uv sync --frozen

      - name: Test
        run: uv run pytest -q -W error
